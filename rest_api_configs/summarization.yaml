components:
  cleaner:
    init_parameters:
      ascii_only: false
      keep_id: false
      remove_empty_lines: true
      remove_extra_whitespaces: true
      remove_regex: null
      remove_repeated_substrings: false
      remove_substrings: null
      unicode_normalization: null
    type: haystack.components.preprocessors.document_cleaner.DocumentCleaner
  generator:
    init_parameters:
      generation_kwargs:
        max_tokens: 2048
        temperature: 0.2
      keep_alive: null
      model: mistral
      raw: false
      streaming_callback: null
      system_prompt: null
      template: null
      timeout: 120
      url: http://localhost:11434
    type: haystack_integrations.components.generators.ollama.generator.OllamaGenerator
  prompt_builder:
    init_parameters:
      required_variables:
      - documents
      - format
      - length
      template: 'STRICTLY SUMMARIZE THE TEXT BELOW. DO NOT ADD ANY INFORMATION.

        Requirements:

        - ONLY use facts that appear in the provided text

        - DO NOT mention documents, attachments, or IDs unless explicitly stated in
        the text

        - DO NOT invent percentages, numbers, or details

        - DO NOT add recommendations or analysis not in the text

        - DO NOT create fake document IDs or reference non-existent attachments


        {% if format == "bulleted" %}

        Return only a bulleted list of the main points. Use a dash (-) at the start
        of each bullet.

        Do not include any section headers, categories, or extra explanation.

        {% else %}

        Return the summary as a concise paragraph.

        {% endif %}


        {% if length == "short" %}

        Make the summary very brief (1-2 sentences or 2-3 bullets, max 40 words).

        {% elif length == "long" %}

        Make the summary detailed and comprehensive (at least 6-8 sentences or 8+
        bullets, 150+ words).

        {% else %}

        Make the summary moderately detailed (3-5 sentences or 4-6 bullets, about
        80 words).

        {% endif %}


        {% for document in documents %}

        {{ document.content }}

        {% endfor %}


        Summary:'
      variables: null
    type: haystack.components.builders.prompt_builder.PromptBuilder
  splitter:
    init_parameters:
      extend_abbreviations: true
      language: en
      respect_sentence_boundary: false
      split_by: word
      split_length: 4000
      split_overlap: 500
      split_threshold: 0
      use_split_rules: true
    type: haystack.components.preprocessors.document_splitter.DocumentSplitter
connection_type_validation: true
connections:
- receiver: splitter.documents
  sender: cleaner.documents
- receiver: prompt_builder.documents
  sender: splitter.documents
- receiver: generator.prompt
  sender: prompt_builder.prompt
max_runs_per_component: 100
metadata: {}
