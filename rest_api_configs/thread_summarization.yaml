components:
  cleaner:
    init_parameters:
      ascii_only: false
      keep_id: false
      remove_empty_lines: true
      remove_extra_whitespaces: true
      remove_regex: null
      remove_repeated_substrings: false
      remove_substrings: null
      unicode_normalization: null
    type: haystack.components.preprocessors.document_cleaner.DocumentCleaner
  doc_to_template_vars:
    init_parameters: {}
    type: haystack_new.DocumentToTemplateVars
  generator:
    init_parameters:
      generation_kwargs:
        max_tokens: 2048
        temperature: 0.2
      keep_alive: null
      model: mistral
      raw: false
      streaming_callback: null
      system_prompt: null
      template: null
      timeout: 120
      url: http://localhost:11434
    type: haystack_integrations.components.generators.ollama.generator.OllamaGenerator
  prompt_builder:
    init_parameters:
      required_variables:
      - documents
      template: 'STRICTLY SUMMARIZE THE EMAIL THREAD BELOW. DO NOT ADD ANY INFORMATION.

        Requirements:

        - ONLY use facts that appear in the provided email thread

        - DO NOT mention documents, attachments, or IDs unless explicitly stated

        - DO NOT invent percentages, numbers, or details

        - DO NOT add recommendations or analysis not in the text

        - DO NOT create fake document IDs or reference non-existent attachments

        - Show the sequence and flow of the conversation

        Return the summary as a concise paragraph.

        Make the summary moderately detailed (3-5 sentences or 4-6 bullets, about
        80 words).

        Thread: {documents}

        Summary:'
      variables: null
    type: haystack.components.builders.prompt_builder.PromptBuilder
  splitter:
    init_parameters:
      extend_abbreviations: true
      language: en
      respect_sentence_boundary: false
      split_by: word
      split_length: 1000
      split_overlap: 50
      split_threshold: 0
      use_split_rules: true
    type: haystack.components.preprocessors.document_splitter.DocumentSplitter
connection_type_validation: true
connections:
- receiver: splitter.documents
  sender: cleaner.documents
- receiver: doc_to_template_vars.documents
  sender: splitter.documents
- receiver: generator.prompt
  sender: prompt_builder.prompt
- receiver: prompt_builder.template_variables
  sender: doc_to_template_vars.template_variables
max_runs_per_component: 100
metadata: {}
